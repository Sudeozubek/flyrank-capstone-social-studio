api:
  server_functions: src/lib/flyrank.functions.ts
  public_endpoints:
    - method: POST
      path: /api/public/fake-platform/{platform}/posts
      purpose: Fake platform publish (Bearer auth, idempotency, 429, async signed webhook)
    - method: GET
      path: /api/public/fake-platform/{platform}/posts
      purpose: Inspect fake platform state
    - method: POST
      path: /api/public/webhooks/delivery
      purpose: HMAC-verified delivery webhook; only writer of terminal status
    - method: POST
      path: /api/public/mcp
      purpose: MCP JSON-RPC endpoint
    - method: GET
      path: /api/public/health
      purpose: Postgres + Redis health probe for Docker reviewers
    - method: GET
      path: /.well-known/oauth-protected-resource
      purpose: RFC 9728 discovery for MCP clients

mcp:
  transport: JSON-RPC 2.0 over HTTP POST
  endpoint: /api/public/mcp
  auth: OAuth 2.1 bearer token, consent screen at /oauth/consent
  vendor_neutral: true
  tools:
    - create_campaign
    - list_campaigns
    - get_campaign
    - campaign_status
    - schedule_campaign
    - publish_campaign
    - retry_campaign
  constraints:
    - MCP is only an interface; it holds no business logic
    - No caption generation, no blog generation, no direct model calls

testing:
  command: npm run test
  framework: vitest
  suites:
    - path: tests/domain.test.ts
      covers: [image geometry, safe zones, captions, idempotency key, backoff, status derivation]
    - path: tests/imaging.test.ts
      covers: [real PNG output at exact platform dimensions]
    - path: tests/security.test.ts
      covers: [token encryption, webhook signatures, no real platform endpoints]
    - path: tests/reliability-probes.test.ts
      covers: [capstone acceptance probes 1-4, idempotency, 429, crash-resume, webhook trust]
    - path: tests/ai-cost-meter.test.ts
      covers: [AI spend tracking, budget guard, caption fallback when budget exhausted]
    - path: tests/ai-spend-snapshot.test.ts
      covers: [AI spend snapshot shape for dashboard]
    - path: tests/campaign-languages.test.ts
      covers: [multi-language caption fragments]
  totals:
    files: 24
    tests: 131

setup:
  install: npm install
  env: cp .env.example .env
  docker: cp .env.docker.example .env.docker && docker compose --env-file .env.docker up --build
  database: apply supabase/flyrank-full-schema.sql in Supabase SQL editor (or use Docker Postgres init)
  dev: npm run dev   # http://localhost:8080 — background worker starts automatically
  seed: npm run seed
  test: npm run test
  build: npm run build

documentation:
  readme: README.md
  evidence: EVIDENCE.md
  buildlog: BUILDLOG.md
  decisions: DECISIONS.md
  env_example: .env.example
  license: LICENSE

constraints:
  no_real_social_apis: true
  fake_platform_only: true

out_of_scope:
  - Real social platform integration
  - Brand templating
  - A/B caption testing
  - Analytics loopback
  - Approval workflow
