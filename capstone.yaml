# capstone.yaml — FlyRank capstone submission metadata

run: npm run dev
seed: npm run seed
test: npm run test
base_url: http://localhost:8080

capstone:
  name: FlyRank
  track: Multi-Platform Social Campaign Engine
  submission_version: "1.0.0"
  submitted_at: "2026-07-31"

project:
  name: CampaignHub Studio
  tagline: Transform a single blog post into a complete multi-platform social campaign.
  description: >-
    Given a published post (title + body + URL), CampaignHub Studio generates per-platform
    image variants and platform-tailored captions, then publishes them immediately or on a
    schedule through a unified adapter interface. The publish path is idempotent, honours
    429 Retry-After, stores OAuth tokens encrypted at rest, and only marks work terminal on a
    signature-verified delivery webhook. A durable lease-based worker makes scheduling
    crash-safe. No real social platform API is ever called.
  repository: "https://github.com/Sudeozubek/flyrank-capstone-social-studio"
  license: MIT
  demo_url: "http://localhost:8080"

author:
  name: "Sude Özübek"
  email: "Sudeozubek@users.noreply.github.com"
  github: "Sudeozubek"

stack:
  language: TypeScript
  runtime: Node.js 20+ / Bun 1.1+
  framework: TanStack Start v1 (React 19, Vite 7)
  database: PostgreSQL with Row Level Security
  storage: Private object storage bucket for generated PNGs
  imaging: [sharp, jimp]
  parsing: [unpdf, mammoth]
  ai: OpenAI gpt-4o-mini (optional; deterministic fallback)
  validation: zod
  testing: vitest
  styling: [tailwindcss v4, shadcn/ui]

architecture:
  style: Clean Architecture (SOLID), dependency rule interfaces -> application -> domain
  layers:
    domain: src/domain          # entities, pure caption + image logic, ports. Zero I/O.
    application: src/application # use cases, depend only on ports
    infrastructure: src/infrastructure # Postgres, imaging, parsing, crypto, AI, publishing
    interfaces:
      http: src/routes/api/public
      server_functions: src/lib/flyrank.functions.ts
      mcp: src/mcp
      web: src/routes, src/components

platforms:
  - id: instagram
    image: { width: 1080, height: 1080, aspect: "1:1" }
    caption: { max_length: 2200, max_hashtags: 8 }
  - id: x
    image: { width: 1600, height: 900, aspect: "16:9" }
    caption: { max_length: 280, max_hashtags: 2 }
  - id: linkedin
    image: { width: 1200, height: 627, aspect: "1.91:1" }
    caption: { max_length: 3000, max_hashtags: 5 }

features:
  - Content ingestion: paste, markdown, PDF, DOCX, curated published-article library
  - Per-platform PNG variants at exact dimensions with safe-zone enforcement
  - LLM-written captions from shared + per-platform prompt fragments, deterministic fallback
  - Unified SocialPublisher adapter interface over an in-repo fake platform
  - Deterministic idempotency keys enforced by a unique database constraint
  - 429 Retry-After handling with exponential backoff and a persisted attempt log
  - Durable lease-based scheduling that resumes after a crash without duplicates
  - Automatic background worker (polls Postgres; no manual tick required)
  - HMAC-SHA256 signed delivery webhooks as the only writer of terminal status
  - AES-256-GCM encrypted OAuth tokens with a fresh IV per write
  - AI cost meter with per-call attribution, per-user DB persistence, and AI_BUDGET_USD guard
  - AI spend dashboard (badge + sidebar panel)
  - Campaign output languages (EN, TR, DE, BS, FR, AR) and brand tone presets
  - Variant gallery carousel (one platform slide at a time)
  - Multi-tenant auth (email/password + Google) with per-user RLS
  - Standalone Model Context Protocol server exposing the campaign lifecycle

